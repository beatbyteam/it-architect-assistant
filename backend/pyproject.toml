[project]
name = "it-architect-assistant-backend"
version = "0.1.0"
description = "Backend foundation for IT Architect Assistant MVP v1"
readme = {text = "IT Architect Assistant backend for the canonical core MVP.", content-type = "text/markdown"}
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.111,<0.112",
  "uvicorn[standard]>=0.30,<0.31",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "sqlalchemy>=2.0.36,<2.1",
  "alembic>=1.14,<1.15",
  "psycopg[binary]>=3.2.6,<3.3",
  "celery[redis]>=5.4,<5.5",
  "redis>=5.2,<6.0",
  "orjson>=3.10,<4.0",
  "httpx>=0.28,<0.29",
  "beautifulsoup4>=4.12,<5.0",
  "trafilatura>=1.12,<2.0",
  "python-docx>=1.1,<2.0",
  "pypdf>=5.0,<6.0",
  "cryptography>=42.0,<47.0",
  "openpyxl>=3.1,<4.0",
  "pgvector>=0.3,<1.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-cov>=5.0,<6.0",
  "ruff>=0.11,<0.12",
  "mypy>=1.11,<2.0"
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["app/tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]
"app/api/v1/routes/mvp.py" = ["E501"]
"app/core/config.py" = ["E501"]
"app/domain/architecture/sectioning.py" = ["E501"]
"app/domain/services/knowledge/update_service.py" = ["E501"]
"app/domain/services/operations.py" = ["E501"]
"app/domain/services/presenters.py" = ["E501"]
"app/domain/services/task_readiness.py" = ["E501"]
"app/domain/services/verification/post_validation.py" = ["E501"]
"app/integrations/generation/contracts.py" = ["E501"]
"app/integrations/generation/prompt_builder.py" = ["E501"]
"app/integrations/knowledge/knowledge_extraction.py" = ["E501"]
"app/schemas/knowledge.py" = ["E501"]
"app/tests/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = false
check_untyped_defs = true
plugins = []
exclude = ["app/tests/"]
