include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

stages:
  - validate
  - test
  - build
  - release

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  DOCKER_VERSION: "27.5.1"
  DOCKER_DRIVER: "overlay2"
  BACKEND_IMAGE_SHA: "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA"
  FRONTEND_IMAGE_SHA: "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHA"
  BACKEND_IMAGE_LATEST: "$CI_REGISTRY_IMAGE/backend:latest"
  FRONTEND_IMAGE_LATEST: "$CI_REGISTRY_IMAGE/frontend:latest"

default:
  interruptible: true
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

.python-cache:
  cache:
    key:
      files:
        - backend/pyproject.toml
    paths:
      - .cache/pip

.docker-registry:
  image: docker:${DOCKER_VERSION}-cli
  services:
    - name: docker:${DOCKER_VERSION}-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - docker info
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin

backend_quality:
  stage: test
  image: python:3.12-slim
  extends: .python-cache
  before_script:
    - cd backend
    - python -m pip install --upgrade pip
    - python -m pip install -e '.[dev]' PyYAML vulture
  script:
    - python -m ruff check app scripts
    - >
      python -m mypy
      app/domain/services/canonical_read_helpers.py
      app/domain/services/knowledge/serializers.py
      app/domain/services/knowledge/update_diffing.py
      app/domain/services/verification/executor_contracts.py
      app/domain/services/verification/rule_engine.py
      app/domain/services/verification/rule_executors.py
      app/integrations/generation/llm_gateway.py
      app/integrations/generation/payload_normalization.py
    - mkdir -p reports
    - python -m pytest app/tests -q --junitxml=reports/pytest.xml --cov=app --cov-report=term-missing --cov-report=xml:reports/coverage.xml --cov-fail-under=70
    - python scripts/check_config_surface.py
    - cd "$CI_PROJECT_DIR"
    - python backend/scripts/check_module_guardrails.py
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: backend/reports/pytest.xml
      coverage_report:
        coverage_format: cobertura
        path: backend/reports/coverage.xml
    paths:
      - backend/reports/

migrations:
  stage: test
  image: python:3.12-slim
  extends: .python-cache
  services:
    - name: pgvector/pgvector:pg17
      alias: postgres
  variables:
    POSTGRES_DB: it_arch_assistant
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/it_arch_assistant
    APP_ENV: test
    AUTH_MODE: local_noauth
  before_script:
    - cd backend
    - python -m pip install --upgrade pip
    - python -m pip install -e '.[dev]'
  script:
    - alembic upgrade head

frontend_quality:
  stage: test
  image: node:22-alpine
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/.npm/
  before_script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline
  script:
    - npm run lint
    - npm run typecheck
    - npm run test:unit
    - npm run test:e2e
    - npm run build
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - frontend/dist/
      - frontend/.test-dist/

compose_validation:
  stage: validate
  image: docker:${DOCKER_VERSION}-cli
  script:
    - docker compose -f compose.yml config
    - >
      docker compose --env-file deploy/local-production.env.example -f deploy/compose.local-production.yml config

script_validation:
  stage: validate
  image: alpine:3.20
  script:
    - sh -n deploy/scripts/local_release_up.sh
    - sh -n deploy/scripts/local_release_down.sh
    - sh -n deploy/scripts/local_release_update.sh
    - sh -n deploy/scripts/run_postman_smoke.sh

newman_smoke:
  stage: test
  image: node:22-alpine
  services:
    - name: docker:${DOCKER_VERSION}-dind
      alias: docker
  variables:
    COMPOSE_PROJECT_NAME: "postman-smoke"
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    HTTP_PORT: "18080"
    OLLAMA_PORT: "11134"
    VITE_API_BASE_URL: "http://localhost:18080/api/v1"
  needs:
    - compose_validation
    - script_validation
  before_script:
    - apk add --no-cache curl docker-cli docker-cli-compose
    - npm install -g newman
    - mkdir -p reports/newman
  script:
    - docker compose --env-file deploy/local-production.env.example -f deploy/compose.local-production.yml up --build -d postgres redis api worker frontend gateway
    - |
      ready=0
      for attempt in $(seq 1 60); do
        if curl -fsS "http://docker:${HTTP_PORT}/api/v1/health/ready"; then
          ready=1
          break
        fi
        echo "Waiting for API readiness, attempt ${attempt}/60"
        sleep 5
      done
      test "$ready" = "1"
    - >
      newman run postman/it-architect-assistant-smoke.postman_collection.json
      -e postman/local.postman_environment.json
      --env-var "rootUrl=http://docker:${HTTP_PORT}"
      --env-var "baseUrl=http://docker:${HTTP_PORT}/api/v1"
      --reporters cli,junit
      --reporter-junit-export reports/newman/postman-smoke.xml
  after_script:
    - docker compose --env-file deploy/local-production.env.example -f deploy/compose.local-production.yml logs --tail=200 api worker gateway || true
    - docker compose --env-file deploy/local-production.env.example -f deploy/compose.local-production.yml down -v --remove-orphans || true
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: reports/newman/postman-smoke.xml
    paths:
      - reports/newman/

build_backend_image:
  stage: build
  extends: .docker-registry
  needs:
    - backend_quality
    - migrations
    - compose_validation
    - script_validation
    - newman_smoke
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  script:
    - docker build --pull -t "$BACKEND_IMAGE_SHA" backend
    - docker push "$BACKEND_IMAGE_SHA"

build_frontend_image:
  stage: build
  extends: .docker-registry
  needs:
    - frontend_quality
    - compose_validation
    - script_validation
    - newman_smoke
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  script:
    - docker build --pull --build-arg VITE_API_BASE_URL="${VITE_API_BASE_URL:-/api/v1}" -t "$FRONTEND_IMAGE_SHA" frontend
    - docker push "$FRONTEND_IMAGE_SHA"

release_latest:
  stage: release
  extends: .docker-registry
  needs:
    - build_backend_image
    - build_frontend_image
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - docker pull "$BACKEND_IMAGE_SHA"
    - docker pull "$FRONTEND_IMAGE_SHA"
    - docker tag "$BACKEND_IMAGE_SHA" "$BACKEND_IMAGE_LATEST"
    - docker tag "$FRONTEND_IMAGE_SHA" "$FRONTEND_IMAGE_LATEST"
    - docker push "$BACKEND_IMAGE_LATEST"
    - docker push "$FRONTEND_IMAGE_LATEST"
