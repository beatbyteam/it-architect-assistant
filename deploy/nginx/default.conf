server {
  listen 80;
  server_name _;
  charset utf-8;
  charset_types text/plain text/css application/json application/javascript application/xml;
  client_max_body_size 512m;
  resolver 127.0.0.11 ipv6=off valid=10s;
  resolver_timeout 5s;

  set $api_upstream api:8000;
  set $frontend_upstream frontend:80;

  location /api/ {
    proxy_pass http://$api_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_connect_timeout 60s;
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
  }

  location /docs {
    proxy_pass http://$api_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location /openapi.json {
    proxy_pass http://$api_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location / {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    proxy_pass http://$frontend_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
